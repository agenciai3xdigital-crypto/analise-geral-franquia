<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inteligência Comercial v2 — Rede Pop Pet Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--vd:#00573F;--v:#009150;--vc:#A8D3C4;--la:#FF6B15;--am:#FDAE25;--az:#71C5E8;--ro:#F1BDC8;--bg:#F3F7F5;--tx:#1C2A25;--mu:#5E6F69;--ln:#DCE6E1;--card:#fff;--ok:#009150;--at:#D97706;--cr:#B4342A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Quicksand,system-ui,sans-serif;font-size:15px;line-height:1.45}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button,select,input{font:inherit}
a{color:var(--v)}
/* ---- cabeçalho ---- */
header{background:linear-gradient(90deg,var(--vd),var(--v));color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
header h1 small{display:block;font-size:12px;font-weight:500;opacity:.85}
header .stamp{margin-left:auto;font-size:12.5px;opacity:.92;text-align:right;line-height:1.35}
header .stamp b{font-weight:700}
header button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
/* ---- layout ---- */
.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 66px)}
nav{background:#fff;border-right:1px solid var(--ln);padding:14px 10px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--tx);font-weight:600;font-size:14px}
nav button.on{background:#E6F4EC;color:var(--vd)}
nav button:hover{background:#EEF4F1}
nav button .ic{width:22px;text-align:center;opacity:.8}
main{padding:18px 22px 60px;min-width:0}
/* ---- filtros ---- */
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
.filters select,.filters input{border:1px solid var(--ln);border-radius:8px;padding:7px 9px;min-width:130px;background:#fff}
.filters .btn{background:var(--v);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.filters .lnk{background:transparent;border:0;color:var(--mu);cursor:pointer;text-decoration:underline;padding:8px 4px}
.cov{font-size:12.5px;color:var(--mu);margin:0 0 14px 4px}
.cov b{color:var(--tx)}
/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px 18px;min-width:0}
.card.full{grid-column:1/-1}
.card h3{margin:0 0 4px;font-size:15.5px;font-weight:700}
.card .sub{margin:0 0 12px;font-size:12.5px;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--ln);border-left:4px solid var(--v);border-radius:10px;padding:12px 14px}
.kpi.o{border-left-color:var(--la)}.kpi.a{border-left-color:var(--am)}.kpi.z{border-left-color:var(--az)}
.kpi span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
.kpi b{display:block;font-size:22px;font-weight:700;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.kpi i{display:block;font-style:normal;font-size:12px;color:var(--mu)}
/* ---- tabelas ---- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:#fff}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#F7FAF8}
td .bar{display:inline-block;height:8px;background:var(--vc);border-radius:4px;vertical-align:middle;margin-right:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.tag.ok{background:#E6F4EC;color:var(--vd)}.tag.at{background:#FFF3D6;color:#9A5B00}.tag.cr{background:#FBE5E2;color:var(--cr)}.tag.nt{background:#EEF1F0;color:var(--mu)}
.prog{height:10px;background:#EEF1F0;border-radius:5px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--v)}
.empty{padding:26px;text-align:center;color:var(--mu);border:1px dashed var(--ln);border-radius:10px}
.warn{background:#FFF7E8;border:1px solid #F5D89A;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.err{background:#FBE5E2;border:1px solid #F0B8B0;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.note{font-size:12.5px;color:var(--mu);margin-top:10px}
.busy{opacity:.55;pointer-events:none}
svg{display:block;width:100%;height:auto}
/* ---- login ---- */
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50}
#login form{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:26px;width:min(380px,92vw);display:flex;flex-direction:column;gap:10px}
#login input{border:1px solid var(--ln);border-radius:8px;padding:9px 11px}
#login button{background:var(--v);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;cursor:pointer}
#login .msg{font-size:13px;color:var(--cr);min-height:18px}
@media (max-width:820px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:4px;border-right:0;border-bottom:1px solid var(--ln)}nav button{width:auto;white-space:nowrap}main{padding:14px}}
</style>
</head>
<body>

<div id="login"><form id="lf">
  <h2 style="margin:0 0 4px">Inteligência Comercial</h2>
  <div style="font-size:13px;color:var(--mu);margin-bottom:6px">Rede Pop Pet Center · acesso da diretoria</div>
  <input id="lEmail" type="email" placeholder="e-mail" autocomplete="username" required>
  <input id="lSenha" type="password" placeholder="senha" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
  <div class="msg" id="lMsg"></div>
</form></div>

<header>
  <h1>Inteligência Comercial <small>Rede Pop Pet Center · v2 · análises calculadas no servidor</small></h1>
  <div class="stamp" id="stamp">—</div>
  <button id="btnSair">Sair</button>
</header>

<div class="wrap">
  <nav id="nav">
    <button data-t="visao" class="on"><span class="ic">📊</span>Visão geral</button>
    <button data-t="rebate"><span class="ic">🤝</span>Rebate por indústria</button>
    <button data-t="dispersao"><span class="ic">💸</span>Dispersão de preço</button>
    <button data-t="margem"><span class="ic">📈</span>Margem por fabricante</button>
    <button data-t="qualidade"><span class="ic">🩺</span>Qualidade dos dados</button>
    <button data-t="cobertura"><span class="ic">🗂️</span>Cobertura de carga</button>
  </nav>
  <main>
    <div class="filters" id="filters">
      <label>De <select id="fDe"></select></label>
      <label>Até <select id="fAte"></select></label>
      <label>UF <select id="fUF"><option value="">Todas</option></select></label>
      <label>Consultor <select id="fCons"><option value="">Todos</option></select></label>
      <label>Loja <input id="fLoja" list="dlLojas" placeholder="nº FRA ou nome"><datalist id="dlLojas"></datalist></label>
      <button class="btn" id="fAplicar">Aplicar</button>
      <button class="lnk" id="fLimpar">limpar</button>
    </div>
    <p class="cov" id="cov"></p>
    <div id="msg"></div>
    <section id="t-visao"></section>
    <section id="t-rebate" hidden></section>
    <section id="t-dispersao" hidden></section>
    <section id="t-margem" hidden></section>
    <section id="t-qualidade" hidden></section>
    <section id="t-cobertura" hidden></section>
  </main>
</div>

<script>
/* ============================================================================
   Painel v2 — o navegador não segura base nenhuma. Cada card é UMA chamada
   RPC ao Postgres (funções v2_*), que devolve o resultado já agregado.
   Regra de leitura: todo número diz sobre quantas lojas e qual período foi
   calculado, e nunca compara recortes diferentes.
   ========================================================================== */
const CFG={url:'https://ltfsujeoliovesvtmrey.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0ZnN1amVvbGlvdmVzdnRtcmV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODg5OTYsImV4cCI6MjEwMzM2NDk5Nn0.ENF_DUG-Jt3XGhwvmPa0YgHyHQYOrBDiEkMuPza82lQ'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v||0);
const fmt0=v=>'R$ '+Math.round(num(v)).toLocaleString('pt-BR');
const fmtK=v=>{v=num(v);const a=Math.abs(v);if(a>=1e9)return 'R$ '+(v/1e9).toLocaleString('pt-BR',{maximumFractionDigits:2})+' bi';if(a>=1e6)return 'R$ '+(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(a>=1e3)return 'R$ '+(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil';return fmt0(v)};
const fmt2=v=>'R$ '+num(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>v==null?'—':num(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
const int=v=>Math.round(num(v)).toLocaleString('pt-BR');
const MESES_PT=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesLabel=m=>{if(!m)return '—';const [y,mo]=m.split('-');return MESES_PT[+mo-1]+'/'+y.slice(2)};
const mesesEntre=(a,b)=>{const out=[];if(!a||!b)return out;let [y,m]=a.split('-').map(Number);const [y2,m2]=b.split('-').map(Number);while(y<y2||(y===y2&&m<=m2)){out.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++}}return out};

let sb=null, USER=null, SAUDE=null, LOJAS=[];
const F={de:'',ate:'',uf:'',cons:'',loja:null};
const CACHE=new Map();               // chave -> resultado (por filtro), zera ao aplicar filtro
const fkey=()=>[F.de,F.ate,F.uf,F.cons,F.loja].join('|');

/* ---------- acesso ---------- */
async function rpc(nome,args={}){
  const a={};Object.entries(args).forEach(([k,v])=>{if(v!==null&&v!==undefined&&v!=='')a[k]=v});
  const k=nome+'|'+JSON.stringify(a);
  if(CACHE.has(k))return CACHE.get(k);
  const {data,error}=await sb.rpc(nome,a);
  if(error)throw new Error(nome+': '+error.message);
  CACHE.set(k,data);return data;
}
const filtrosRpc=()=>({p_desde:F.de,p_ate:F.ate,p_uf:F.uf||null,p_consultor:F.cons||null,p_loja:F.loja||null});

function showLogin(msg){$('#login').style.display='flex';$('#lMsg').textContent=msg||'';try{const em=localStorage.getItem('pop_email');if(em)$('#lEmail').value=em}catch(e){}}
function hideLogin(){$('#login').style.display='none'}

async function conectar(){
  if(!window.supabase){showLogin('Não foi possível carregar a biblioteca do Supabase. Verifique a internet e recarregue.');return}
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data:{session}}=await sb.auth.getSession();
  if(session){USER=session.user;hideLogin();await iniciar();return}
  showLogin('');
}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lMsg').textContent='Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
  if(error){$('#lMsg').textContent='Não foi possível entrar: '+error.message;return}
  try{localStorage.setItem('pop_email',$('#lEmail').value.trim())}catch(x){}
  USER=data.user;hideLogin();await iniciar();
};
$('#btnSair').onclick=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};

/* ---------- início: uma chamada leve, depois a aba aberta ---------- */
async function iniciar(){
  try{
    SAUDE=await rpc('v2_saude');
  }catch(e){
    if(/restrito|42501|permission/i.test(e.message)){await sb.auth.signOut();showLogin('Este painel é restrito à diretoria/administração.');return}
    $('#msg').innerHTML=`<div class="err">Erro ao conectar: ${esc(e.message)}</div>`;return;
  }
  LOJAS=SAUDE.lojas||[];
  const fim=[SAUDE.compra_fim,SAUDE.venda_fim].filter(Boolean).sort().pop();
  const ini=[SAUDE.compra_ini,SAUDE.venda_ini].filter(Boolean).sort()[0];
  const meses=mesesEntre(ini,fim);
  const opt=(sel,arr,lab)=>{const s=$(sel);s.innerHTML=arr.map(m=>`<option value="${m}">${lab?lab(m):m}</option>`).join('')};
  opt('#fDe',meses,mesLabel);opt('#fAte',meses,mesLabel);
  // padrão: últimos 12 meses fechados
  const d12=meses.slice(-12);F.de=d12[0]||ini;F.ate=fim;$('#fDe').value=F.de;$('#fAte').value=F.ate;
  $('#fUF').innerHTML='<option value="">Todas</option>'+(SAUDE.ufs||[]).map(u=>`<option>${esc(u)}</option>`).join('');
  $('#fCons').innerHTML='<option value="">Todos</option>'+(SAUDE.consultores||[]).map(u=>`<option>${esc(u)}</option>`).join('');
  $('#dlLojas').innerHTML=LOJAS.map(l=>`<option value="${esc((l.fra?l.fra+' · ':'')+l.nome)}">`).join('');
  const at=SAUDE.atualizado_em?new Date(SAUDE.atualizado_em):null;
  $('#stamp').innerHTML=`<b>${esc(USER.email)}</b><br>agregados atualizados ${at?at.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'} · atualiza toda noite às 3h30`;
  pintarCobertura();
  await abrir(abaAtiva());
}

function pintarCobertura(){
  $('#cov').innerHTML=`Compra: <b>${SAUDE.lojas_com_compra} lojas</b> (${mesLabel(SAUDE.compra_ini)}–${mesLabel(SAUDE.compra_fim)}) · Venda por produto: <b>${SAUDE.lojas_com_venda} lojas</b> (${mesLabel(SAUDE.venda_ini)}–${mesLabel(SAUDE.venda_fim)}) · <b>${SAUDE.pct_valor_com_industria}%</b> do valor comprado com indústria identificada · ${int(SAUDE.rotulos_pendentes)} rótulos ainda sem de-para`;
}

/* ---------- filtros ---------- */
function lojaSelecionada(){const v=$('#fLoja').value.trim();if(!v)return null;const fra=v.split(' · ')[0];const l=LOJAS.find(l=>l.fra===fra)||LOJAS.find(l=>l.nome.toLowerCase()===v.toLowerCase())||LOJAS.find(l=>l.nome.toLowerCase().includes(v.toLowerCase()));return l?l.id:null}
$('#fAplicar').onclick=()=>{F.de=$('#fDe').value;F.ate=$('#fAte').value;if(F.de>F.ate){[F.de,F.ate]=[F.ate,F.de];$('#fDe').value=F.de;$('#fAte').value=F.ate}
  F.uf=$('#fUF').value;F.cons=$('#fCons').value;F.loja=lojaSelecionada();
  if($('#fLoja').value.trim()&&!F.loja){$('#msg').innerHTML='<div class="warn">Loja não encontrada — digite o nº FRA ou escolha na lista.</div>';return}
  $('#msg').innerHTML='';document.querySelectorAll('main section').forEach(s=>s.dataset.k='');abrir(abaAtiva())};
$('#fLimpar').onclick=()=>{$('#fUF').value='';$('#fCons').value='';$('#fLoja').value='';$('#fAplicar').click()};
['#fDe','#fAte','#fUF','#fCons'].forEach(s=>$(s).onchange=()=>$('#fAplicar').click());
$('#fLoja').onchange=()=>$('#fAplicar').click();

/* ---------- navegação: cada aba desenha só quando aberta, e só se o filtro mudou ---------- */
function abaAtiva(){return document.querySelector('#nav button.on')?.dataset.t||'visao'}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!=='t-'+b.dataset.t);abrir(b.dataset.t)});
const ABAS={visao:renderVisao,rebate:renderRebate,dispersao:renderDispersao,margem:renderMargem,qualidade:renderQualidade,cobertura:renderCobertura};
async function abrir(t){
  const sec=$('#t-'+t);if(!sec)return;
  const k=fkey();if(sec.dataset.k===k)return;   // já desenhada com este filtro
  sec.classList.add('busy');if(!sec.innerHTML)sec.innerHTML='<div class="empty">Calculando no servidor…</div>';
  try{await ABAS[t]();sec.dataset.k=k}
  catch(e){sec.innerHTML=`<div class="err">Não foi possível calcular esta aba: ${esc(e.message)}</div>`}
  finally{sec.classList.remove('busy')}
}
const recorte=()=>{const p=[mesLabel(F.de)+' – '+mesLabel(F.ate)];if(F.uf)p.push('UF '+F.uf);if(F.cons)p.push('consultor '+F.cons);if(F.loja){const l=LOJAS.find(x=>x.id===F.loja);if(l)p.push(l.nome)}return p.join(' · ')};

/* ---------- tabela genérica com ordenação ---------- */
function tabela(cols,rows,opts={}){
  const id='t'+Math.random().toString(36).slice(2,8);
  const st={k:opts.sort??1,asc:!!opts.asc};
  const draw=()=>{const c=cols[st.k];const s=[...rows].sort((a,b)=>{const x=c.v(a),y=c.v(b);const r=typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??''),'pt-BR');return st.asc?r:-r});
    const el=document.getElementById(id);if(!el)return;
    el.innerHTML=`<table><thead><tr>${cols.map((c,i)=>`<th class="${c.n?'n':''}" data-i="${i}">${c.t}${i===st.k?(st.asc?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${s.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f?c.f(r):esc(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody>${opts.foot?`<tfoot><tr>${opts.foot.map((f,i)=>`<td class="${cols[i]?.n?'n':''}"><b>${f}</b></td>`).join('')}</tr></tfoot>`:''}</table>`;
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;if(st.k===i)st.asc=!st.asc;else{st.k=i;st.asc=false}draw()});
    if(opts.onRow)el.querySelectorAll('tbody tr').forEach((tr,i)=>{tr.style.cursor='pointer';tr.onclick=()=>opts.onRow(s[i])});
  };
  setTimeout(draw,0);return `<div class="tw" id="${id}"></div>`;
}
const barra=(v,max)=>`<span class="bar" style="width:${Math.max(2,Math.round(70*num(v)/(max||1)))}px"></span>`;

/* ---------- gráfico mensal: barras de compra + linha de venda (mesma base à direita) ---------- */
function chartMensal(serie){
  if(!serie.length)return '<div class="empty">Sem meses no recorte.</div>';
  const W=980,H=260,L=64,R=16,T=18,B=40,w=W-L-R,h=H-T-B;
  const maxV=Math.max(...serie.map(s=>Math.max(num(s.compra),num(s.venda))))||1;
  const y=v=>T+h-h*num(v)/maxV;const bw=Math.max(6,(w/serie.length)*0.55);const x=i=>L+w*(i+0.5)/serie.length;
  const ticks=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${T+h-h*f}" y2="${T+h-h*f}" stroke="#DCE6E1"/><text x="${L-8}" y="${T+h-h*f+4}" font-size="10" text-anchor="end" fill="#5E6F69">${fmtK(maxV*f).replace('R$ ','')}</text>`).join('');
  const bars=serie.map((s,i)=>`<rect x="${x(i)-bw/2}" y="${y(s.compra)}" width="${bw}" height="${T+h-y(s.compra)}" fill="#009150" opacity=".85"><title>${mesLabel(s.mes)} · compra ${fmtK(s.compra)} · ${s.lojas_compra} lojas</title></rect>`).join('');
  const pts=serie.filter(s=>s.venda!=null).map((s)=>`${x(serie.indexOf(s))},${y(s.venda)}`).join(' ');
  const dots=serie.filter(s=>s.venda!=null).map(s=>`<circle cx="${x(serie.indexOf(s))}" cy="${y(s.venda)}" r="3.5" fill="#FF6B15"><title>${mesLabel(s.mes)} · venda ${fmtK(s.venda)} · ${s.lojas_venda} lojas</title></circle>`).join('');
  const lab=serie.map((s,i)=>(serie.length<=14||i%2===0)?`<text x="${x(i)}" y="${H-14}" font-size="10" text-anchor="middle" fill="#5E6F69">${mesLabel(s.mes)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${ticks}${bars}${pts?`<polyline points="${pts}" fill="none" stroke="#FF6B15" stroke-width="2.5" stroke-linejoin="round"/>`:''}${dots}${lab}
   <rect x="${L}" y="${H-8}" width="10" height="8" fill="#009150" opacity=".85"/><text x="${L+14}" y="${H}" font-size="10.5" fill="#5E6F69">compra</text>
   <rect x="${L+70}" y="${H-5}" width="10" height="2.5" fill="#FF6B15"/><text x="${L+84}" y="${H}" font-size="10.5" fill="#5E6F69">venda por produto (só lojas com BI Global)</text></svg>`;
}
const spark=(serie,w=120,h=26)=>{if(!serie?.length)return '';const mx=Math.max(...serie.map(s=>num(s.valor)))||1;const bw=w/serie.length;return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;display:inline-block;vertical-align:middle">${serie.map((s,i)=>`<rect x="${i*bw+1}" y="${h-h*num(s.valor)/mx}" width="${Math.max(1,bw-2)}" height="${h*num(s.valor)/mx}" fill="#009150" opacity=".8"><title>${mesLabel(s.mes)} ${fmtK(s.valor)}</title></rect>`).join('')}</svg>`};

async function renderVisao(){

  const rank=(titulo,rows,sub)=>{const mx=rows[0]?num(rows[0].valor):1;return `<div class="card"><h3>${titulo}</h3><p class="sub">${sub}</p>${tabela([
      {t:'#',v:r=>rows.indexOf(r)+1,n:true},{t:titulo.split(' ').pop(),v:r=>r.dimensao,f:r=>esc(r.dimensao)+(r.mapeado===false&&titulo.includes('indústria')?' <span class="tag nt" title="rótulo sem de-para para indústria">sem de-para</span>':'')},
      {t:'Valor',v:r=>num(r.valor),n:true,f:r=>barra(r.valor,mx)+fmtK(r.valor)},{t:'Share',v:r=>num(r.share_pct),n:true,f:r=>pct(r.share_pct)},
      {t:'Acum.',v:r=>num(r.acumulado_pct),n:true,f:r=>pct(r.acumulado_pct)},{t:'Lojas',v:r=>num(r.lojas),n:true}],rows,{sort:2})}</div>`};
  sec.innerHTML=`
   <div class="kpis">
    <div class="kpi"><span>Compra no período</span><b>${fmtK(k.compra)}</b><i>${k.lojas_compra} lojas · ${k.meses} meses · ${int(k.nfs)} NFs</i></div>
    <div class="kpi"><span>Média mensal de compra</span><b>${fmtK(num(k.compra)/(k.meses||1))}</b><i>ritmo do recorte</i></div>
    <div class="kpi o"><span>Venda por produto</span><b>${fmtK(k.venda)}</b><i>${k.lojas_venda} lojas com BI Global · ${int(k.pedidos)} cupons de varejo</i></div>
    <div class="kpi z"><span>Venda identificada</span><b>${pct(k.pct_identificado)}</b><i>cupons com cliente cadastrado</i></div>
    <div class="kpi a"><span>Compra com indústria identificada</span><b>${pct(k.pct_compra_com_industria)}</b><i>o resto é rótulo sem de-para</i></div>
    <div class="kpi"><span>Linhas de compra sem custo</span><b>${pct(k.pct_custo0)}</b><i>bonificação ou erro de lançamento</i></div>
   </div>
   <div class="grid">
    <div class="card full"><h3>Compra × venda por mês</h3><p class="sub">${esc(recorte())}. A venda só existe para as lojas com BI Global — por isso as barras e a linha <b>não são comparáveis entre si</b>. Comparação na mesma base, só nas ${ambos.length?Math.max(...ambos.map(x=>x.lojas_ambos)):0} lojas que têm compra e venda: compra ${fmtK(cA)} · venda ${fmtK(vA)}${cA?' · venda/compra '+(vA/cA).toLocaleString('pt-BR',{maximumFractionDigits:2}):''}.</p>${chartMensal(serie)}</div>
    ${rank('Top indústrias',rInd,'Compra somada por indústria (de-para de rótulos). Linhas "sem de-para" são rótulos que ainda não apontam para nenhuma indústria.')}
    ${rank('Top fornecedores',rFor,'Quem emite a nota. Distribuidor ≠ indústria.')}
    ${rank('Top marcas',rMarca,'Marca cadastrada (ou rótulo bruto quando não mapeada).')}
    ${rank('Por categoria',rCat,'Categoria do item de entrada.')}
   </div>`;
}

async function renderRebate(){
  const sec=$('#t-rebate');const rows=await rpc('v2_rebate',filtrosRpc());
  if(!rows.length){sec.innerHTML=`<div class="card"><h3>Rebate por indústria</h3><div class="empty">Nenhum acordo cadastrado no banco.<br><small>Os acordos são cadastrados no painel atual (aba Acordos). Assim que existirem, este card calcula atingimento, faixa e projeção por indústria automaticamente.</small></div></div>`;return}
  const totalReb=rows.reduce((s,r)=>s+num(r.rebate_estimado),0),totalProj=rows.reduce((s,r)=>s+num(r.rebate_projetado),0),totalComp=rows.reduce((s,r)=>s+num(r.comprado),0);
  sec.innerHTML=`
   <div class="kpis">
    <div class="kpi"><span>Acordos</span><b>${rows.length}</b><i>${esc(recorte())}</i></div>
    <div class="kpi"><span>Comprado nas indústrias c/ acordo</span><b>${fmtK(totalComp)}</b><i>dentro da vigência de cada acordo</i></div>
    <div class="kpi o"><span>Rebate já garantido</span><b>${fmtK(totalReb)}</b><i>pela faixa atingida até agora</i></div>
    <div class="kpi a"><span>Rebate projetado</span><b>${fmtK(totalProj)}</b><i>mantendo o ritmo mensal até o fim</i></div>
   </div>
   <div class="card full"><h3>Acordos</h3><p class="sub">Comprado = soma na indústria (ou nos rótulos do acordo) entre início e fim. Projeção = ritmo mensal × meses de vigência. Faixa = % que a indústria paga ao atingir o valor.</p>
   ${tabela([
     {t:'Acordo',v:r=>r.acordo,f:r=>`<b>${esc(r.acordo)}</b><br><small style="color:var(--mu)">${esc(r.industria)} · ${mesLabel(r.inicio)}–${mesLabel(r.fim)}${r.distribuidor?' · '+esc(r.distribuidor):''}</small>${r.aviso?`<br><span class="tag at">${esc(r.aviso)}</span>`:''}`},
     {t:'Comprado',v:r=>num(r.comprado),n:true,f:r=>`${fmtK(r.comprado)}<br><small style="color:var(--mu)">${r.lojas} lojas · ${r.meses_decorridos}/${r.meses_vigencia} meses</small>`},
     {t:'Meta',v:r=>num(r.meta),n:true,f:r=>r.meta?`<div class="prog" title="${pct(r.atingimento_pct)}"><i style="width:${Math.min(100,num(r.atingimento_pct))}%;background:${num(r.atingimento_pct)>=100?'var(--ok)':num(r.atingimento_pct)>=70?'var(--am)':'var(--cr)'}"></i></div><small>${pct(r.atingimento_pct)} de ${fmtK(r.meta)}</small>`:'—'},
     {t:'Faixa atual',v:r=>num(r.faixa_atual),n:true,f:r=>num(r.faixa_atual)>0?`<span class="tag ok">${pct(r.faixa_atual)}</span>`:`<span class="tag nt">nenhuma</span>`},
     {t:'Rebate garantido',v:r=>num(r.rebate_estimado),n:true,f:r=>fmtK(r.rebate_estimado)},
     {t:'Projeção',v:r=>num(r.projecao),n:true,f:r=>`${fmtK(r.projecao)}<br><small style="color:var(--mu)">rebate ${fmtK(r.rebate_projetado)}</small>`},
     {t:'Próxima faixa',v:r=>num(r.falta_proxima),n:true,f:r=>r.proxima_faixa?`${fmtK(r.proxima_faixa)}<br><small style="color:var(--mu)">faltam ${fmtK(r.falta_proxima)}</small>`:'<span class="tag ok">máxima</span>'},
     {t:'Mês a mês',v:r=>0,f:r=>spark(r.serie)}],rows,{sort:1})}</div>`;
}

async function renderDispersao(){
  const sec=$('#t-dispersao');const rows=await rpc('v2_dispersao',{p_min_lojas:5,p_limite:60});
  const eco=rows.reduce((s,r)=>s+num(r.economia_p25),0),val=rows.reduce((s,r)=>s+num(r.valor),0);
  sec.innerHTML=`
   <div class="warn">Esta análise é da <b>rede inteira, últimos 3 meses</b> — os filtros de período e loja não se aplicam aqui. "Economia" = quanto a rede pagou acima do 1º quartil (p25), que é o preço que um quarto das lojas já consegue. Antes de virar pauta, confira unidade de compra (caixa × unidade) nos itens de maior dispersão.</div>
   <div class="kpis">
    <div class="kpi"><span>SKUs comparáveis (top 60)</span><b>${rows.length}</b><i>comprados por 5+ lojas</i></div>
    <div class="kpi"><span>Valor comprado nesses SKUs</span><b>${fmtK(val)}</b><i>3 meses</i></div>
    <div class="kpi o"><span>Economia se todos ao p25</span><b>${fmtK(eco)}</b><i>${val?pct(100*eco/val):'—'} do valor</i></div>
   </div>
   <div class="card full"><h3>Onde a rede paga mais caro</h3><p class="sub">Clique num produto para ver o preço de cada loja.</p>
   ${tabela([
     {t:'Produto',v:r=>r.produto,f:r=>`<b>${esc(r.produto)}</b><br><small style="color:var(--mu)">${esc(r.fabricante||'')} · EAN ${esc(r.ean)}</small>`},
     {t:'Lojas',v:r=>num(r.lojas),n:true},{t:'Qtd',v:r=>num(r.qtd),n:true,f:r=>int(r.qtd)},{t:'Valor',v:r=>num(r.valor),n:true,f:r=>fmtK(r.valor)},
     {t:'Mín',v:r=>num(r.minimo),n:true,f:r=>fmt2(r.minimo)},{t:'p25',v:r=>num(r.p25),n:true,f:r=>fmt2(r.p25)},{t:'Mediana',v:r=>num(r.mediana),n:true,f:r=>fmt2(r.mediana)},{t:'Máx',v:r=>num(r.maximo),n:true,f:r=>fmt2(r.maximo)},
     {t:'Dispersão',v:r=>num(r.dispersao_pct),n:true,f:r=>`<span class="tag ${num(r.dispersao_pct)>100?'cr':num(r.dispersao_pct)>40?'at':'ok'}">${pct(r.dispersao_pct)}</span>`},
     {t:'Economia p25',v:r=>num(r.economia_p25),n:true,f:r=>`<b>${fmtK(r.economia_p25)}</b>`}],rows,{sort:9,onRow:abrirDispersaoLoja})}</div>
   <div id="dispDet"></div>`;
}
async function abrirDispersaoLoja(r){
  const el=$('#dispDet');el.innerHTML='<div class="empty">Buscando por loja…</div>';
  const rows=await rpc('v2_dispersao_loja',{p_ean:r.ean});
  const p25=num(r.p25);
  el.innerHTML=`<div class="card full" style="margin-top:14px"><h3>${esc(r.produto)} — preço por loja (3 meses)</h3><p class="sub">p25 da rede ${fmt2(r.p25)} · mediana ${fmt2(r.mediana)}. Sobrepreço = (preço da loja − p25) × quantidade.</p>
   ${tabela([{t:'FRA',v:x=>x.fra},{t:'Loja',v:x=>x.loja},{t:'UF',v:x=>x.uf},{t:'Fornecedor',v:x=>x.fornecedor},{t:'Qtd',v:x=>num(x.qtd),n:true,f:x=>int(x.qtd)},
     {t:'Preço médio',v:x=>num(x.preco_medio),n:true,f:x=>`<span class="tag ${num(x.preco_medio)>p25*1.5?'cr':num(x.preco_medio)>p25*1.1?'at':'ok'}">${fmt2(x.preco_medio)}</span>`},
     {t:'Sobrepreço',v:x=>Math.max(0,(num(x.preco_medio)-p25)*num(x.qtd)),n:true,f:x=>fmtK(Math.max(0,(num(x.preco_medio)-p25)*num(x.qtd)))}],rows,{sort:5,asc:true})}</div>`;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

async function renderMargem(){
  const sec=$('#t-margem');const rows=await rpc('v2_margem',{p_desde:F.de,p_ate:F.ate,p_limite:40});
  sec.innerHTML=`
   <div class="warn">Margem só é medida onde existe custo: <b>apenas as lojas que têm compra e venda por produto</b>, cruzando pelo EAN. Filtros de UF/consultor/loja não se aplicam aqui. "Cobertura" é a fatia da venda que tem custo no sistema — margem com cobertura baixa não vale nada.</div>
   <div class="card full"><h3>Compra × venda × margem por fabricante</h3><p class="sub">${mesLabel(F.de)} – ${mesLabel(F.ate)} · ordenado por venda. A compra costuma ser maior que a venda porque abastece estoque que ainda não girou; leia a <b>ordem relativa</b> das margens, não a razão compra/venda.</p>
   ${tabela([{t:'Fabricante',v:r=>r.fabricante},{t:'Compra',v:r=>num(r.compra),n:true,f:r=>fmtK(r.compra)},{t:'Venda',v:r=>num(r.venda),n:true,f:r=>fmtK(r.venda)},
     {t:'Lucro',v:r=>num(r.lucro),n:true,f:r=>fmtK(r.lucro)},
     {t:'Margem',v:r=>num(r.margem_pct),n:true,f:r=>`<span class="tag ${num(r.cobertura_custo_pct)<70?'nt':num(r.margem_pct)>=35?'ok':num(r.margem_pct)>=25?'at':'cr'}">${pct(r.margem_pct)}</span>`},

const CHECKS=[
 ['c_custo0','Compra custo 0','Itens de entrada com custo R$ 0 (bonificação sem marcação ou erro).'],
 ['c_outlier','Custo fora do padrão','Custo unitário 3× acima ou abaixo da mediana da rede para o mesmo EAN (caixa × unidade, digitação).'],
 ['c_divers','Compra s/ fabricante','Fabricante em branco ou DIVERSOS na entrada. Prejudica rebate e indústria.'],
 ['c_ean','Compra s/ EAN','Sem código de barras não cruza com venda nem compara entre lojas.'],
 ['v_custo0','Venda custo 0','Produto vendido sem custo — margem inflada.'],
 ['v_neg','Venda abaixo do custo','Lucro negativo na linha.'],
 ['v_inst','Venda institucional','50+ unidades no cupom. Não é erro, mas fica fora do varejo.'],
 ['x_gap','Meses sem dado','Meses entre o primeiro e o último carregado sem nenhuma linha de compra.'],
 ['x_parcial','Mês parcial','Mês com menos da metade das linhas que a loja costuma ter (arquivo cortado).']];
async function renderQualidade(){
  const sec=$('#t-qualidade');const rows=await rpc('v2_qualidade',filtrosRpc());
  const tot=k=>rows.reduce((s,r)=>s+num(r[k]),0);
  const cL=tot('c_linhas'),vL=tot('v_linhas');
  const p=(k,base)=>base?pct(100*tot(k)/base):'—';
  sec.innerHTML=`
   <div class="kpis">
    <div class="kpi"><span>Lojas avaliadas</span><b>${rows.length}</b><i>${esc(recorte())}</i></div>
    <div class="kpi a"><span>Lojas com score ≥ 8</span><b>${rows.filter(r=>num(r.score)>=8).length}</b><i>precisam de atenção</i></div>
    <div class="kpi"><span>Compra custo 0</span><b>${p('c_custo0',cL)}</b><i>das linhas de compra</i></div>
    <div class="kpi o"><span>Venda custo 0</span><b>${p('v_custo0',vL)}</b><i>das linhas de venda · ${fmtK(tot('v_custo0_valor'))}</i></div>
    <div class="kpi"><span>Custo fora do padrão</span><b>${p('c_outlier',cL)}</b><i>${fmtK(tot('c_outlier_valor'))} em compras</i></div>
    <div class="kpi"><span>Venda abaixo do custo</span><b>${p('v_neg',vL)}</b><i>perda ${fmtK(tot('v_neg_valor'))}</i></div>
   </div>
   <div class="card full"><h3>Por loja</h3><p class="sub">Score = soma dos pesos dos problemas acima do limite (0 = limpa). CMV/compras fora de 0,90–1,10 indica custo faltando (abaixo) ou custo lançado errado (acima). Clique no cabeçalho para ordenar.</p>
   ${tabela([
     {t:'FRA',v:r=>r.fra},{t:'Loja',v:r=>r.loja,f:r=>`${esc(r.loja)}<br><small style="color:var(--mu)">${esc(r.uf||'')}${r.consultor?' · '+esc(r.consultor):''}</small>`},
     {t:'Score',v:r=>num(r.score),n:true,f:r=>`<span class="tag ${num(r.score)>=8?'cr':num(r.score)>=4?'at':'ok'}">${r.score}</span>`},
     {t:'Compra custo 0',v:r=>num(r.c_custo0)/(num(r.c_linhas)||1),n:true,f:r=>pct(100*num(r.c_custo0)/(num(r.c_linhas)||1))},
     {t:'Fora do padrão',v:r=>num(r.c_outlier)/(num(r.c_linhas)||1),n:true,f:r=>pct(100*num(r.c_outlier)/(num(r.c_linhas)||1))},
     {t:'S/ fabricante',v:r=>num(r.c_divers)/(num(r.c_linhas)||1),n:true,f:r=>pct(100*num(r.c_divers)/(num(r.c_linhas)||1))},
     {t:'S/ EAN',v:r=>num(r.c_ean)/(num(r.c_linhas)||1),n:true,f:r=>pct(100*num(r.c_ean)/(num(r.c_linhas)||1))},
     {t:'Venda custo 0',v:r=>num(r.v_custo0)/(num(r.v_linhas)||1),n:true,f:r=>num(r.v_linhas)?pct(100*num(r.v_custo0)/num(r.v_linhas)):'<span class="tag nt">sem venda</span>'},
     {t:'Abaixo do custo',v:r=>num(r.v_neg)/(num(r.v_linhas)||1),n:true,f:r=>num(r.v_linhas)?pct(100*num(r.v_neg)/num(r.v_linhas)):'—'},
     {t:'CMV/compras',v:r=>num(r.x_cmv),n:true,f:r=>r.x_cmv==null?'—':`<span class="tag ${num(r.x_cmv)<0.9||num(r.x_cmv)>1.1?'at':'ok'}">${num(r.x_cmv).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>`},
     {t:'Meses s/ dado',v:r=>num(r.x_gap),n:true,f:r=>num(r.x_gap)?`<span class="tag at">${r.x_gap}</span>`:'0'},
     {t:'Meses parciais',v:r=>num(r.x_parcial),n:true,f:r=>num(r.x_parcial)?`<span class="tag at">${r.x_parcial}</span>`:'0'}],rows,{sort:2})}
   <div class="note"><b>O que cada check mede:</b> ${CHECKS.map(c=>`<b>${c[1]}</b> — ${c[2]}`).join(' · ')}</div></div>`;
}

   ${tabela([{t:'FRA',v:r=>r.fra},{t:'Loja',v:r=>r.loja,f:r=>`${esc(r.loja)}<br><small style="color:var(--mu)">${esc(r.uf||'')}${r.consultor?' · '+esc(r.consultor):''}${r.status!=='Ativa'?' · <span class="tag nt">'+esc(r.status)+'</span>':''}</small>`},
     {t:'Meses c/ compra',v:r=>num(r.meses_compra),n:true,f:r=>`<span class="tag ${num(r.meses_compra)>=esperados?'ok':num(r.meses_compra)>0?'at':'cr'}">${r.meses_compra}/${esperados}</span>`},

}
