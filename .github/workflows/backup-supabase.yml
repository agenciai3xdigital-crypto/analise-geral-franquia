# Backup diário do banco do Painel de Compras (Supabase) via GitHub Actions.
# Caminho no repositório: .github/workflows/backup-supabase.yml
# O dump fica salvo como "artifact" (privado, 90 dias). Nada é commitado no repositório.

name: Backup Supabase

on:
  schedule:
    - cron: "0 6 * * *"      # 06:00 UTC = 03:00 Brasília
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    container:
      image: postgres:17     # já traz o pg_dump na versão compatível com o Supabase
    steps:
      - name: Testar conexão
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then echo "ERRO: segredo SUPABASE_DB_URL não encontrado"; exit 1; fi
          psql "$DB_URL" -c "select now(), (select count(*) from lojas) as lojas, (select count(*) from entradas) as entradas, (select count(*) from vendas) as vendas;"

      - name: Gerar dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          DATA=$(date -u +%Y-%m-%d_%H%M)
          pg_dump "$DB_URL" \
            --no-owner --no-privileges \
            --schema=public \
            --table=public.lojas \
            --table=public.entradas \
            --table=public.vendas \
            --table=public.acordos \
            --table=public.produtos_mestre \
            --format=custom \
            --file="painel_pop_${DATA}.dump"
          gzip -9 "painel_pop_${DATA}.dump"
          ls -la *.gz

      - name: Guardar como artifact (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: backup-supabase-${{ github.run_id }}
          path: painel_pop_*.dump.gz
          retention-days: 90
